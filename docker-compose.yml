# BabyMonitor. Three containers: the API, nginx serving the built frontend, and a
# nightly backup.
#
# Only the web container publishes a port, and only on 127.0.0.1 — nothing is reachable
# from outside until you put a tunnel or a reverse proxy in front of it. See README.md,
# "Making it reachable from outside the house".
#
# Start:  ./install.sh   (or: docker compose up -d --build)

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # A fixed name, because nginx in the neighbouring container resolves exactly this.
    container_name: babymonitor-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "3010"
      HOUSEHOLD_SECRET: ${HOUSEHOLD_SECRET:?HOUSEHOLD_SECRET fehlt - siehe .env.example}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET fehlt - siehe .env.example}
      # Behind the tunnel the browser sees HTTPS -> the cookie has to be `secure`.
      COOKIE_SECURE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only a suggestion for the setup screen; the binding value lives with the child.
      DEFAULT_REGION: ${DEFAULT_REGION:-none}
      # Without the keys, notifications are simply off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
    volumes:
      # A bind mount rather than a named volume: the SQLite file should sit in the file
      # system where `sqlite3 .backup` and a quick `ls` work without detours.
      - ./data:/data
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    # An unambiguous name rather than the Compose alias `web`: several projects can
    # share an external network, and `web` would collide there.
    container_name: babymonitor-web
    restart: unless-stopped
    depends_on:
      - api
    # localhost only: reachable for debugging and tests on the machine itself, not from
    # outside. The public path runs exclusively through your tunnel or proxy.
    ports:
      - "127.0.0.1:8090:80"
    environment:
      # How long the files of an older release stay around.
      ASSET_KEEP_DAYS: ${ASSET_KEEP_DAYS:-30}
    volumes:
      # Survives rebuilding the image so a device still running the old version keeps
      # finding its files. See web/entrypoint.sh.
      - ./data/web-assets:/usr/share/nginx/html/assets
    networks:
      - internal
      - cloudflare_proxy

  backup:
    image: alpine:3.20
    container_name: babymonitor-backup
    restart: unless-stopped
    volumes:
      # Read-only is enough for `.backup` — a backup must never modify the database.
      - ./data:/data:ro
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    command: ["sh", "/backup.sh"]
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    networks:
      - internal

networks:
  internal:
    driver: bridge
  cloudflare_proxy:
    external: true
