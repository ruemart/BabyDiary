server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hinter dem Cloudflare-Tunnel; die echte Client-IP steht im Header.
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Fotos können groß sein, bevor der Client sie verkleinert hat.
  client_max_body_size 16m;

  location /api/ {
    proxy_pass http://babymonitor-api:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Der Zeitraffer wird beim Abruf erzeugt und darf bei vielen Fotos dauern.
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Mit Hash im Dateinamen: unveränderlich, dauerhaft cachebar.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Der Service Worker darf NIE aus dem Cache kommen — sonst hängt ein Gerät
  # dauerhaft auf einer alten Fassung der App fest, ohne dass jemand merkt warum.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    expires off;
  }

  # Einzelseiten-Anwendung: jede unbekannte Adresse landet in der App.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
