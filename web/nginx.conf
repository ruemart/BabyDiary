server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Behind a tunnel or proxy; the real client IP sits in the header.
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Photos can be large before the client has shrunk them.
  client_max_body_size 16m;

  location /api/ {
    proxy_pass http://babydiary-api:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The time-lapse is built on request and may take a while with many photos.
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # With a hash in the file name: immutable, cacheable forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must NEVER come from the cache — otherwise a device is stuck on
  # an old version of the app forever and nobody can tell why.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    expires off;
  }

  # Single-page app: every unknown address lands in the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
