<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app may draw under the notch and the home indicator;
         the CSS picks up the safe areas via env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="Track feeds, nappies, sleep and development" />

    <!-- iOS only shows the app without Safari's bars when both are set. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      The label under the icon on the home screen, and the title in the browser tab.

      Both say the child's name — an app for one particular child has no business
      carrying a product name. What stands here is only what a device sees before the
      app has loaded and before a child exists at all; App.vue overwrites both from the
      child record as soon as it knows it, and iOS reads the tag from the live page at
      the moment "Add to Home Screen" is tapped.
    -->
    <meta name="apple-mobile-web-app-title" content="Baby Diary" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The manifest comes from the API, because it carries the child's name and that is
      not known when the image is built. `use-credentials` is what makes the browser
      send the session cookie with the fetch — without it the API cannot tell who is
      asking and answers with the generic name.
    -->
    <link rel="manifest" href="/api/manifest.webmanifest" crossorigin="use-credentials" />

    <title>Baby Diary</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
