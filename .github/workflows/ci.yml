name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 strips types on load — the API runs the source directly,
          # so the CI version has to match what the container uses.
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck --workspace=web
      - run: npm run build --workspace=web

  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Fails when a language file has keys the others do not — the cheapest way
      # to keep a half-finished translation from silently shipping.
      - run: npm test --workspace=web -- locales

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose build
